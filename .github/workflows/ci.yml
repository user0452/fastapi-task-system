name: CI

on:
  push:
    branches: [main, "codex/**", "feature/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: a3_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      ENABLE_LEGACY_ROUTES: "true"
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_NAME: a3_ci_test
      A3_TEST_DATABASE_NAME: a3_ci_test
      A3_E2E_DATABASE_NAME: a3_e2e_test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      A3_MOCK_LLM: "true"
      A3_MOCK_EMBEDDING: "true"
      DEEPSEEK_API_KEY: ci-placeholder
      DEEPSEEK_BASE_URL: https://example.invalid
      DEEPSEEK_MODEL: ci-placeholder

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: uv sync --locked --dev
      - name: Apply database migrations
        run: uv run alembic upgrade head
      - name: Backend lint and type check
        run: |
          uv run ruff check app tests
          uv run mypy app
      - name: Backend tests and critical coverage
        run: >-
          uv run pytest
          --cov=app.modules.courses.service
          --cov=app.modules.materials.service
          --cov=app.modules.learning.service
          --cov=app.modules.agent.service
          --cov=app.modules.agent.native_tool_agent
          --cov=app.modules.agent.router
          --cov=app.jobs.material_index_job
          --cov-fail-under=70
          --cov-report=term-missing
          -q

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend lint, tests and build
        working-directory: frontend
        run: |
          npm run lint
          npm run test:run
          npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: |
          mkdir -p var
          DATABASE_NAME="$A3_E2E_DATABASE_NAME" \
            uv run python scripts/run_e2e_backend.py > var/e2e-backend.log 2>&1 &
          BACKEND_PID=$!
          (
            cd frontend
            VITE_API_TARGET=http://127.0.0.1:8011 \
              npm run dev -- --host 127.0.0.1 --port 5176 > ../var/e2e-frontend.log 2>&1
          ) &
          FRONTEND_PID=$!
          trap 'kill "$BACKEND_PID" "$FRONTEND_PID" 2>/dev/null || true' EXIT
          for url in http://127.0.0.1:8011/health/ready http://127.0.0.1:5176; do
            for attempt in $(seq 1 60); do
              if curl --fail --silent "$url" >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "Timed out waiting for $url"
                exit 1
              fi
              sleep 1
            done
          done
          cd frontend
          PLAYWRIGHT_EXTERNAL_SERVERS=true npm run test:e2e
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          if-no-files-found: ignore
          path: |
            var/e2e-backend.log
            var/e2e-frontend.log
            frontend/test-results
            frontend/playwright-report
