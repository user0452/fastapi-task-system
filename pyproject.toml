[project]
name = "a3-course-coach"
version = "1.0.0"
description = "A3 course sprint coach with an adaptive learning loop and controlled AI agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5,<2",
    "argon2-cffi>=25.1.0",
    "bcrypt==4.0.1",
    "cryptography>=46.0.7",
    "faiss-cpu>=1.14.3",
    "fastapi>=0.135.3",
    "langchain>=1.3.1",
    "langchain-openai>=1.2.2",
    "numpy>=2.4.6",
    "passlib>=1.7.4",
    "pymysql>=1.1.2",
    "pypdf>=6.13.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "requests>=2.33.1",
    "sentence-transformers>=5.5.1",
    "sqlalchemy>=2.0.51,<2.1",
    "tzdata>=2025.2",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".venv", "static", "var"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["app"]
exclude = ["app/core/migrations.py"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["agents.*", "llm_client", "models", "routers.*", "services.*", "utils"]
follow_imports = "skip"
ignore_errors = true
